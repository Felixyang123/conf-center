spring:
  application:
    name: config-samples

logging:
  level:
    com.wly.config: debug
server:
  port: 8081

conf-client:
  server-address: http://localhost:8080
  access-token: defaultToken
  env: dev
  appname: ${spring.application.name}

instance-client:
  server-address: http://localhost:8080
  access-token: defaultToken
  env: dev
  heartbeatInterval: 30000
  host: localhost
  port: ${server.port}
  appname: ${spring.application.name}
